name               = "proxy"
main               = "src/index.js"
compatibility_date = "2026-04-04"
workers_dev        = false 
preview_urls       = false

# Vars
[vars]
DISPLAY_NAME    = "NIMENDRA"
BLOG_URL        = "https://blog.nimendra.online"
GITHUB_URL      = "https://github.com/nmdra"
TWITTER_URL     = "https://twitter.com/nimendra_"
LINKEDIN_URL    = "https://linkedin.com/in/nimendra"
EMAIL           = "contact@nimendra.online"
GOODREADS       = "https://goodreads.com/nimendra"
LAST_UPDATED    = "2026-03-19"
WORKERS_DEV_URL = "frosty-meadow-9381.nimendraonline.workers.dev"

# Rate Limiting
[[ratelimits]]
name         = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit  = 60
period = 60

# Placement
[placement]
mode = "smart"

